<!-- Updated cart.html -->
<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ตะกร้าสินค้า</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" />
  <style>
    body {
      background-image: url(images/39.jpg);
      z-index: -1;
      background-size: cover;
      background-position: center;
      filter: brightness(90%);
      background-attachment: fixed;
    }

    /* คอนเทนเนอร์หลัก */
    .container {
      margin: 20px auto;
      padding: 20px;
      max-width: 95%;
      background-color: #1e1e1eb9;
      /* พื้นหลังเข้ม */
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
      /* เงาลึก */
    }

    /* ส่วนหัว */
    h2 {
      text-align: center;
      color: #ffcc00;
      /* สีทอง */
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
      /* เงาข้อความ */
      margin-bottom: 20px;
    }

    h4 {
      color: #ffffff;
    }

    /* ตาราง */
    .table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    .table-container {
      display: none;
      /* ซ่อนตารางตั้งแต่เริ่มต้น */
      margin-top: 15px;
    }

    .table th {
      background-color: #000000f8;
      /* พื้นหลังหัวตาราง */
      color: #ff0000;
      /* สีทอง */
      font-size: 16px;
      text-transform: uppercase;
      padding: 10px;
      border-bottom: 2px solid #3a3a3a;
    }

    .table td {
      padding: 2px;
      text-align: center;
      color: #000000;
      border-bottom: 1px solid #333;
      white-space: nowrap;
      /* ป้องกันการตัดบรรทัด */
      overflow: hidden;
      /* ซ่อนข้อความส่วนเกิน */
      text-overflow: ellipsis;
      /* แสดง ... เมื่อข้อความเกิน */
      max-width: 70px;
      /* กำหนดความกว้างสูงสุด */
    }

    .table tr:nth-child(even) {
      background-color: #1b1b1b;
      /* แถวสีเข้ม */
    }

    .table tr:nth-child(odd) {
      background-color: #242424;
      /* แถวสีอ่อน */
    }

    .table tr:hover {
      background-color: #333333;
      /* สีเมื่อ hover */
      transition: background-color 0.2s ease-in-out;
    }

    /* ปุ่ม */
    .btn {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      display: inline-block;
      transition: all 0.3s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
    }

    .btn-primary {
      background-color: #000000;
      color: #fdba00;
    }

    .btn-primary:hover {
      background-color: #0000002c;
      transform: scale(1.05);
      /* ขยายเล็กน้อย */
    }

    .btn-secondary {
      background-color: #ffffff41;
      color: #fdba00;
    }

    .btn-secondary:hover {
      background-color: #ffffff70;
    }

    .btn-danger {
      background-color: #d32f2f;
      color: #ffffff;
      padding: 5px;
    }

    .btn-danger:hover {
      background-color: #b71c1c;
    }

    /* ฟอร์มกรอกข้อมูล */
    .form-label {
      font-size: 14px;
      font-weight: bold;
      color: #ffffff93;
      /* สีทอง */
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #444444;
      border-radius: 5px;
      background-color: #1e1e1e;
      color: #e0e0e0;
    }

    input:focus {
      border-color: #ffcc00;
      outline: none;
      box-shadow: 0 0 5px #ffcc00;
    }

    /* ส่วนยอดรวม */
    .totalPrice {
      color: #ffcc00;
      /* สีทอง */
      font-size: 22px;
      font-weight: bold;
      text-align: right;
      margin-bottom: 20px;
    }

    /* Footer */
    .modal-footer {
      display: flex;
      justify-content: space-between;
      padding-top: 15px;
    }

    .btn-btn-secondary {
      width: 60%;
      padding: 8px;
      margin-bottom: 10px;
      border: 2px solid #ffffff;
      border-radius: 13px;
      background-color: #000000;
      color: #fdba00;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDfTFhwCW7pcyj06oqxeMyzwHqWPNRJ8e0",
      authDomain: "jojutjan.firebaseapp.com",
      projectId: "jojutjan",
      storageBucket: "jojutjan.firebasestorage.app",
      messagingSenderId: "1010237466401",
      appId: "1:1010237466401:web:88855a3237647f1718c060",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>
</head>

<body>
  <audio id="inputSound" src="music/pim.mp3" preload="auto"></audio>
  <audio id="buttonSound" src="music/songs1.mp3" preload="auto"></audio>
  <div class="container">
    <audio id="click-sound">
      <source src="music/songs1.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>
    <audio id="sound">
      <source src="music/cm1.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>
    <audio id="thank2">
      <source src="music/thank2.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>

    <h2 class="mt-4">ตะกร้าสินค้า</h2>
    <div class="modal-body">
      <div class="section-header">
        <button id="toggleTableButton" class="btn-btn-secondary">
          *ตรวจสอบสินค้า...
        </button>
      </div>
      <div id="productTableSection" class="table-container">
        <div class="table-responsive">
          <table class="table table-bordered">
            <thead>
              <tr>
                <th>ชื่อ</th>
                <th>ชิ้น</th>
                <th>ราคา</th>
                <th>รวม</th>
                <th>ลบ</th>
              </tr>
            </thead>
            <tbody id="cartTable"></tbody>
          </table>
        </div>
      </div>

      <h5 class="totalPrice">ยอดรวม: <span id="totalPrice">0</span> บาท</h5>
      <h4>ข้อมูลติดต่อ</h4>
      <div class="mb-3">
        <label for="customerName" class="form-label">ชื่อ</label>
        <input type="text" id="customerName" class="form-control" placeholder="กรอกชื่อของคุณ" required />
      </div>
      <div class="mb-3">
        <label for="customerPhone" class="form-label">เบอร์โทร</label>
        <input type="tel" id="customerPhone" class="form-control" placeholder="กรอกเบอร์โทรของคุณ" required />
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="playClickSoundAndNavigate()">
        สั่งเพิ่ม
      </button>
      <button type="button" class="btn btn-primary" id="placeOrderButton">
        ยืนยันคำสั่งซื้อ
      </button>
    </div>
  </div>

  <script>
    function updateCart() {
      const clickSound = document.getElementById("sound");
      clickSound.play();
      const cartTable = document.getElementById("cartTable");
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      let total = 0;
      // ตรวจสอบจำนวนรวมของสินค้าทั้งหมด
      const stockData = {}; // เก็บจำนวนสินค้าที่เหลือในสต็อก
      cart.forEach((item) => {
        if (!stockData[item.name]) {
          stockData[item.name] = item.remainingQty || item.qty; // ใช้ remainingQty หรือ qty
        }
        stockData[item.name] -= item.qty; // ลดจำนวนที่เลือก
      });
      // สร้างตารางสินค้า
      cartTable.innerHTML = cart
        .map((item, index) => {
          const subtotal = item.price * item.qty;
          total += subtotal;
          return `
          <tr>
            <td>${item.name}</td>
            <td>${item.qty}</td>
            <td>${item.price}</td>
            <td>${subtotal}</td>
            <td><button class="btn btn-danger btn-sm" onclick="removeFromCart(${index})">ลบ</button></td>
          </tr>
        `;
        })
        .join("");
      if (cart.length === 0) {
        cartTable.innerHTML =
          "<tr><td colspan='5'>ไม่มีสินค้าในตะกร้า</td></tr>";
      }
      document.getElementById("totalPrice").textContent = total;
    }

    function placeOrder() {
      const customerName = document.getElementById("customerName").value.trim();
      const customerPhone = document.getElementById("customerPhone").value.trim();
      const cart = JSON.parse(localStorage.getItem("cart")) || [];

      if (!customerName || !customerPhone) {
        alert("กรุณากรอกข้อมูลลูกค้าให้ครบถ้วน");
        return;
      }

      const totalPrice = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

      const orderData = {
        customerName,
        customerPhone,
        items: cart.map((item) => ({
          name: item.name,
          qty: item.qty,
          price: item.price,
          subtotal: item.qty * item.price,
        })),
        totalPrice,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      };

      db.collection("orders").add(orderData)
        .then(async (docRef) => {
          console.log("บันทึกใน 'orders' สำเร็จ");

          const orderId = docRef.id; // ✅ ดึง docId เพื่อใส่ในข้อความ Telegram

          await db.collection("order").add(orderData);

          await updateStockAfterOrder(cart);

          // ✅ ส่ง Telegram ทันที พร้อม Order ID
          await sendTelegramMessageFromCart(orderData, orderId);

          for (const item of cart) {
            await addToStockLogs({
              name: item.name,
              qty: item.qty,
              price: item.price,
              remainingQty: item.remainingQty,
              action: "สั่งซื้อ",
            });
          }

          localStorage.removeItem("cart");
          alert("สั่งซื้อสำเร็จ! รอร้านตอบกลับภายใน 5 นาที");
          window.location.href = "index.html";
        })
        .catch((error) => {
          console.error("❌ เกิดข้อผิดพลาดในการสั่งซื้อ:", error);
          alert("เกิดข้อผิดพลาดในการสั่งซื้อ");
        });
    }
    async function sendTelegramMessageFromCart(order, orderId = "-") {
      const token = "8197665346:AAE2rXhq057hDUW1ELXDdFG18fPsgyRb5oA";
      const chatId = "7470108466";

      const itemsText = order.items.map(item =>
        `📌 ${item.name} (฿${item.price} x ${item.qty}) = ฿${item.subtotal}`
      ).join("\n");

      const timestamp = new Date().toLocaleString("th-TH", {
        timeZone: "Asia/Bangkok",
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      }).replace(",", "");

      const message =
        `📝 *คำสั่งซื้อหน้าร้านใหม่!*
━━━━━━━━━━━━━━━━━━
🔹 Order ID: ${orderId}
👤 ลูกค้า: ${order.customerName} (${order.customerPhone})
━━━━━━━━━━━━━━━━━━
📦 รายการสินค้า: 
${itemsText}
━━━━━━━━━━━━━━━━━━
💰 ยอดรวม: ฿${order.totalPrice.toFixed(2)}
━━━━━━━━━━━━━━━━━━
⏰ เวลาที่สั่ง: ${timestamp}
━━━━━━━━━━━━━━━━━━
🌳 jojutjan: https://jojutjan.web.app/latests.html`;

      const payload = {
        chat_id: chatId,
        text: message,
        parse_mode: "Markdown"
      };

      try {
        const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (!result.ok) {
          console.error("❌ Telegram ส่งไม่สำเร็จ:", result);
        }
      } catch (error) {
        console.error("❌ ส่ง Telegram ล้มเหลว:", error);
      }
    }

    async function updateStockAfterOrder(cart) {
      try {
        const querySnapshot = await db
          .collection("mama")
          .orderBy("timestamp", "desc")
          .limit(1)
          .get();
        if (!querySnapshot.empty) {
          const latestDoc = querySnapshot.docs[0];
          const docRef = latestDoc.ref;
          const items = latestDoc.data().items;

          cart.forEach((cartItem) => {
            const product = items.find((item) => item.name === cartItem.name);
            if (product) {
              product.remainingQty = product.remainingQty || product.qty;
              product.remainingQty -= cartItem.qty;
              if (product.remainingQty < 0) product.remainingQty = 0;
            }
          });

          await docRef.update({ items });
          console.log("Stock updated successfully!");
        }
      } catch (error) {
        console.error("Error updating stock:", error);
      }
    }

    async function addToStockLogs(logItem) {
      const clickSound = document.getElementById("thank2");
      clickSound.play();
      try {
        await db.collection("stockLogs").add({
          name: logItem.name,
          qty: logItem.qty,
          price: logItem.price,
          remainingQty: logItem.remainingQty,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          action: logItem.action,
        });
        console.log("Stock log added successfully!");
      } catch (error) {
        console.error("Error adding to stockLogs:", error);
      }
    }

    function removeFromCart(index) {
      const clickSound = document.getElementById("sound");
      clickSound.play();
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      cart.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(cart));
      updateCart();
    }

    function playClickSoundAndNavigate() {
      setTimeout(() => {
        window.location.href = "index.html";
      }, 200); // หน่วงเวลา 300ms (ปรับตามความยาวของเสียงที่ต้องการ)
    }

    document.addEventListener("DOMContentLoaded", () => {
      const inputSound = document.getElementById("inputSound");
      const buttonSound = document.getElementById("buttonSound");

      // เล่นเสียงเมื่อเริ่มโฟกัสหรือเปลี่ยนค่าช่อง input
      document.querySelectorAll("input").forEach((input) => {
        input.addEventListener("focus", () => {
          inputSound.currentTime = 0; // เล่นเสียงตั้งแต่ต้น
          inputSound.play();
        });

        input.addEventListener("input", () => {
          inputSound.currentTime = 0; // เล่นเสียงตั้งแต่ต้น
          inputSound.play();
        });
      });

      // เล่นเสียงเมื่อคลิกปุ่ม
      document.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          buttonSound.currentTime = 0; // เล่นเสียงตั้งแต่ต้น
          buttonSound.play();
        });
      });
    });

    document.addEventListener("DOMContentLoaded", () => {
      const toggleTableButton = document.getElementById("toggleTableButton");
      const productTableSection = document.getElementById(
        "productTableSection"
      );

      productTableSection.style.display = "none";

      toggleTableButton.addEventListener("click", () => {
        const isHidden = productTableSection.style.display === "none";

        // สลับการแสดงผล
        productTableSection.style.display = isHidden ? "block" : "none";

        // เปลี่ยนข้อความปุ่ม
        toggleTableButton.textContent = isHidden
          ? "*ซ่อนตารางสินค้า"
          : "*ตรวจสอบสินค้า";
      });
    });

    document.addEventListener("DOMContentLoaded", () => {
      updateCart();
      document
        .getElementById("placeOrderButton")
        .addEventListener("click", placeOrder);
    });
  </script>
</body>

</html>
