<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบจัดการคำสั่งซื้อ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" />
  <style>
    body {
      background-color: #4a637c;
    }

    .table th,
    .table td {
      text-align: center;
      vertical-align: middle;
    }

    .container {
      max-width: 1200px;
    }

    #joe {
      background-color: #ffbd0673;
      /* สีพื้นหลังของหัวตาราง */
      color: rgb(0, 0, 0);
      /* สีข้อความของหัวตาราง */
      font-weight: bold;
      /* ทำให้ข้อความตัวหนา */
      border: 2px solid #000000;
      /* สีเส้นขอบของเซลล์หัวตาราง */
      padding: 10px;
      /* เพิ่มระยะห่างภายในเซลล์ */
      text-align: center;
      /* จัดข้อความให้อยู่กึ่งกลาง */
    }

    #joe th {
      background-color: #ffbd06;
      /* สีพื้นหลังของหัวตาราง */
      color: rgb(0, 0, 0);
      /* สีข้อความของหัวตาราง */
      font-weight: bold;
      /* ทำให้ข้อความตัวหนา */
      border: 2px solid #000000;
      /* สีเส้นขอบของเซลล์หัวตาราง */
      padding: 10px;
      /* เพิ่มระยะห่างภายในเซลล์ */
      text-align: center;
      /* จัดข้อความให้อยู่กึ่งกลาง */
    }
  </style>
</head>

<body>
  <div class="container mt-5">
    <h2 class="text-center mb-4">จัดการลิงก์วิดีโอ</h2>
    <form id="videoLinkForm">
      <div class="mb-3">
        <label for="videoLink" class="form-label">ลิงก์วิดีโอ</label>
        <input type="url" id="videoLink" class="form-control"
          placeholder="ใส่ลิงก์วิดีโอ (YouTube, Facebook หรือ URL วิดีโออื่น)" required />
      </div>
      <button type="button" class="btn btn-primary" onclick="saveVideoLink()">
        บันทึก
      </button>
      <button type="button" class="btn btn-danger" onclick="deleteVideoLink()">
        ลบไลฟ์
      </button>

    </form>

    <div id="currentVideoLink" class="mt-4">
      <h3>ลิงก์วิดีโอที่บันทึกไว้:</h3>
      <p id="savedLink">ไม่มีข้อมูล</p>
    </div>
  </div>


  <h1 class="text-center mb-4">ระบบจัดการคำสั่งซื้อ</h1>
  <!-- ค้นหา -->
  <div class="d-flex justify-content-between mb-3">
    <input type="text" id="searchInput" class="form-control w-50" placeholder="ค้นหาด้วยชื่อลูกค้าหรือวันที่" />
    <button class="btn btn-primary" onclick="fetchOrders()">
      โหลดข้อมูล
    </button>
    <button class="btn btn-danger" onclick="clearAllData()">
      เคลียร์ข้อมูล
    </button>
  </div>

  <!-- ตารางข้อมูลคำสั่งซื้อ -->
  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>วันที่</th>
        <th>ชื่อ</th>
        <th>ยอดรวม</th>
        <th>รายละเอียด</th>
      </tr>
    </thead>
    <tbody id="ordersTable">
      <tr>
        <td colspan="5">ไม่มีข้อมูลคำสั่งซื้อ</td>
      </tr>
    </tbody>
  </table>
  </div>

  <!-- Modal สำหรับแสดงรายละเอียดคำสั่งซื้อ -->
  <div class="modal fade" id="orderDetailsModal" tabindex="-1" aria-labelledby="orderDetailsLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="orderDetailsLabel">
            รายละเอียดคำสั่งซื้อ
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div id="joe" class="modal-body">
          <h6>วันที่: <span id="orderDate"></span></h6>
          <h6>ชื่อลูกค้า: <span id="customerName"></span></h6>
          <h6>เบอร์โทร: <span id="customerPhone"></span></h6>
          <h6>ยอดรวม: <span id="totalPrice"></span> บาท</h6>
          <hr />
          <h6>รายการสินค้า:</h6>
          <table id="joe" class="table table-bordered">
            <thead>
              <tr>
                <th>สินค้า</th>
                <th>จำนวน</th>
                <th>ราคา/ชิ้น</th>
                <th>รวมเงิน</th>
              </tr>
            </thead>
            <tbody id="orderItemsTable">
              <!-- รายการสินค้า -->
            </tbody>
          </table>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            ปิด
          </button>
          <button id="downloadScreenshot" class="btn btn-success">
            ดาวน์โหลดรูปภาพ
          </button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDfTFhwCW7pcyj06oqxeMyzwHqWPNRJ8e0",
      authDomain: "jojutjan.firebaseapp.com",
      projectId: "jojutjan",
      storageBucket: "jojutjan.firebasestorage.app",
      messagingSenderId: "1010237466401",
      appId: "1:1010237466401:web:88855a3237647f1718c060",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    document.addEventListener("DOMContentLoaded", () => {
      console.log("DOM fully loaded and parsed.");
      // โค้ดทั้งหมดของคุณที่เกี่ยวกับ html2canvas ควรอยู่ที่นี่
    });

    async function fetchOrders() {
      const ordersTable = document.getElementById("ordersTable");
      const searchQuery = document
        .getElementById("searchInput")
        .value.toLowerCase();
      ordersTable.innerHTML =
        "<tr><td colspan='5'>กำลังโหลดข้อมูล...</td></tr>";

      try {
        const querySnapshot = await db
          .collection("orders")
          .orderBy("timestamp", "desc")
          .get();
        let orders = [];
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const date = data.timestamp
            ? data.timestamp.toDate().toLocaleString()
            : "ไม่ระบุ";
          const customerName = data.customerName || "ลูกค้าทั่วไป";
          const customerPhone = data.customerPhone || "ไม่ระบุ"; // ดึงเบอร์โทร
          orders.push({
            id: doc.id,
            date,
            customerName,
            customerPhone, // เก็บเบอร์โทร
            totalPrice: data.totalPrice,
          });
        });

        // กรองข้อมูลตามคำค้นหา
        if (searchQuery) {
          orders = orders.filter(
            (order) =>
              order.customerName.toLowerCase().includes(searchQuery) ||
              order.date.includes(searchQuery)
          );
        }

        // แสดงข้อมูลในตาราง
        if (orders.length === 0) {
          ordersTable.innerHTML = "<tr><td colspan='5'>ไม่พบข้อมูล</td></tr>";
        } else {
          ordersTable.innerHTML = orders
            .map(
              (order, index) => ` 
        <tr>
          <td>${index + 1}</td>
          <td>${order.date}</td>
          <td>${order.customerName}</td>
          <td>${order.totalPrice}</td>
          <td>
            <button class="btn btn-info btn-sm" onclick="viewDetails('${order.id
                }')">ดูรายละเอียด</button>
          </td>
        </tr>
      `
            )
            .join("");
        }
      } catch (error) {
        console.error("Error fetching orders:", error);
        ordersTable.innerHTML =
          "<tr><td colspan='5'>เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>";
      }
    }

    function listenForUpdates() {
      db.collection("orders")
        .orderBy("timestamp", "desc")
        .onSnapshot((snapshot) => {
          snapshot.docChanges().forEach((change) => {
            if (change.type === "added") {
              fetchOrders(); // รีเฟรชข้อมูลในตารางเมื่อมีคำสั่งซื้อใหม่
            }
          });
        });
    }

    async function viewDetails(orderId) {
      try {
        const doc = await db.collection("orders").doc(orderId).get();
        if (!doc.exists) {
          alert("ไม่พบคำสั่งซื้อที่เลือก");
          return;
        }

        const data = doc.data();
        const date = data.timestamp
          ? data.timestamp.toDate().toLocaleString()
          : "ไม่ระบุ";
        const customerName = data.customerName || "ลูกค้าทั่วไป";
        const customerPhone = data.customerPhone || "ไม่ระบุ"; // ดึงเบอร์โทร
        const totalPrice = data.totalPrice;
        const items = data.items || [];

        // แสดงข้อมูลใน Modal
        document.getElementById("orderDate").textContent = date;
        document.getElementById("customerName").textContent = customerName;
        document.getElementById("customerPhone").textContent = customerPhone; // แสดงเบอร์โทร
        document.getElementById("totalPrice").textContent = totalPrice;

        const orderItemsTable = document.getElementById("orderItemsTable");
        orderItemsTable.innerHTML = items
          .map(
            (item) => `
      <tr>
        <td>${item.name}</td>
        <td>${item.qty}</td>
        <td>${item.price}</td>
        <td>${item.subtotal}</td>
      </tr>
    `
          )
          .join("");

        const modal = new bootstrap.Modal(
          document.getElementById("orderDetailsModal")
        );
        modal.show();

        // บันทึกรูปภาพคำสั่งซื้อ
        const downloadScreenshotButton =
          document.getElementById("downloadScreenshot");
        downloadScreenshotButton.addEventListener("click", async () => {
          const modalBody = document.querySelector(
            "#orderDetailsModal .modal-body"
          );
          if (!modalBody || modalBody.style.display === "none") {
            alert("กรุณาเปิด modal ก่อนทำการจับภาพ");
            return;
          }

          try {
            const canvas = await html2canvas(modalBody);
            const imageUrl = canvas.toDataURL("image/png");
            const link = document.createElement("a");
            link.href = imageUrl;
            link.download = `order_details_${orderId}.png`; // ตั้งชื่อไฟล์ตามหมายเลขคำสั่งซื้อ
            link.click();
          } catch (error) {
            console.error("Error generating screenshot:", error);
          }
        });
      } catch (error) {
        console.error("Error fetching order details:", error);
      }
    }

    // เรียกฟังก์ชันเพื่อนำข้อมูลคำสั่งซื้อมาแสดง
    fetchOrders();
    listenForUpdates();

    async function clearAllData() {
      if (
        !confirm(
          "คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลทั้งหมด? การดำเนินการนี้ไม่สามารถย้อนกลับได้!"
        )
      ) {
        return;
      }

      try {
        // ลบคำสั่งซื้อทั้งหมดในคอลเลกชัน "orders"
        const ordersSnapshot = await db.collection("orders").get();
        const batch = db.batch();

        ordersSnapshot.forEach((doc) => {
          batch.delete(doc.ref); // เพิ่มเอกสารที่ต้องการลบใน batch
        });

        // ลบข้อมูลใน batch
        await batch.commit();
        alert("ลบข้อมูลทั้งหมดสำเร็จแล้ว!");

        // รีเฟรชข้อมูลในตาราง
        fetchOrders();
      } catch (error) {
        console.error("Error clearing all data:", error);
        alert("เกิดข้อผิดพลาดในการลบข้อมูล");
      }
    }

    async function deleteVideoLink() {
      if (!confirm("คุณแน่ใจหรือไม่ว่าต้องการลบลิงก์ไลฟ์สด?")) {
        return; // ยกเลิกหากผู้ใช้ไม่ยืนยัน
      }

      try {
        await db.collection("settings").doc("video").delete(); // ลบ document
        alert("ลบลิงก์ไลฟ์สดสำเร็จ!");
        document.getElementById("savedLink").textContent = "ไม่มีข้อมูล"; // อัปเดต UI
        document.getElementById("videoLink").value = ""; // เคลียร์ฟิลด์ลิงก์
      } catch (error) {
        console.error("Error deleting video link:", error);
        alert("เกิดข้อผิดพลาดในการลบลิงก์");
      }
    }

    function getYouTubeEmbedUrl(videoUrl) {
      const url = new URL(videoUrl);

      // สำหรับลิงก์แบบ youtube.com/watch?v=xxxx
      if (url.hostname === "www.youtube.com" && url.pathname === "/watch") {
        const videoId = url.searchParams.get("v");
        return `https://www.youtube.com/embed/${videoId}`;
      }

      // สำหรับลิงก์แบบ youtu.be/xxxx
      if (url.hostname === "youtu.be") {
        const videoId = url.pathname.substring(1);
        return `https://www.youtube.com/embed/${videoId}`;
      }

      // สำหรับลิงก์ช่องที่กำลังไลฟ์สด
      if (url.hostname === "www.youtube.com" && url.pathname.startsWith("/channel")) {
        const channelId = url.pathname.split("/")[2];
        return `https://www.youtube.com/embed/live_stream?channel=${channelId}`;
      }

      // **ใหม่: สำหรับลิงก์ youtube.com/live/{VIDEO_ID}**
      if (url.hostname === "www.youtube.com" || url.hostname === "youtube.com") {
        if (url.pathname.startsWith("/live")) {
          const videoId = url.pathname.split("/")[2];
          return `https://www.youtube.com/embed/${videoId}`;
        }
      }

      return ""; // คืนค่าว่างหากไม่ใช่ลิงก์ YouTube
    }

    async function saveVideoLink() {
      const videoLink = document.getElementById("videoLink").value.trim();
      const embedUrl = getYouTubeEmbedUrl(videoLink);

      if (!embedUrl) {
        alert("กรุณากรอกลิงก์ YouTube ที่ถูกต้อง");
        return;
      }

      try {
        await db.collection("settings").doc("video").set({
          url: embedUrl,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        });

        alert("บันทึกลิงก์วิดีโอ/ไลฟ์สดสำเร็จ!");
        loadVideoLink();
      } catch (error) {
        console.error("Error saving video link:", error);
        alert("ไม่สามารถบันทึกลิงก์ได้");
      }
    }

    async function loadVideoLink() {
      try {
        const doc = await db.collection("settings").doc("video").get();
        const savedLink = document.getElementById("savedLink");

        if (doc.exists) {
          const data = doc.data();
          savedLink.innerHTML = `<a href="${data.url}" target="_blank">${data.url}</a>`;
          document.getElementById("videoLink").value = data.url || "";
        } else {
          savedLink.textContent = "ไม่มีข้อมูล";
        }
      } catch (error) {
        console.error("Error loading video link:", error);
        alert("ไม่สามารถโหลดลิงก์ได้");
      }
    }



    document.addEventListener("DOMContentLoaded", loadVideoLink);

  </script>
</body>

</html>
