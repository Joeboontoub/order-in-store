    h4 {

    button {
      background-color: #00c006;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #45a049b7;
    }

    .button-container {
      display: flex;
      justify-content: center;

      gap: 20px;
      /* กำหนดระยะห่างระหว่างปุ่ม */
      margin-top: 20px;
      /* กำหนดระยะห่างจากด้านบน */
    }

    .toggle-btn {
      background-color: #000000;
      color: white;
      border: none;
      margin: 0px;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .toggle-btn:hover {
      background-color: #000000;
    }

    .toggle-btn:active {
      transform: scale(0.95);
    }

    input[type="number"],
    input[type="text"] {
      width: calc(50% - 10px);
      padding: 10px;
      margin: 5px 5px 20px 0;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
      box-sizing: border-box;
    }

    @media (max-width: 600px) {

      input[type="number"],
      input[type="text"] {
        width: 100%;
        margin: 5px 0;
      }
    }

    table {
      color: #000000;
      width: 100%;
      border: 0px solid #ffffff;

    }

    th,

      border-radius: 5px;
      padding: 1px;
      text-align: center;
    }


    th {
      background-color: #000000;
      color: #ff0000;
      border: 1px solid #ffffff;
      text-align: center;
    }

  <script>
    function addNewItem(name = "", qty = "", price = "", imageName = "") {
      const customItemsContainer = document.getElementById("customItems");
      const div = document.createElement("div");
      div.className = "custom-item";
      div.innerHTML = `
    <input type="text" placeholder="ชื่อรายการ" class="item-name" value="${name}">
    <input type="number" placeholder="จำนวน" class="item-qty" min="0" value="${qty}">
    <input type="number" placeholder="ราคา" class="item-price" min="0" value="${price}">
    <select class="item-image-name">
      <option value="">เลือกชื่อรูปภาพ</option>
    </select>
    <img src="${imageName || ""
        }" alt="Preview" class="image-preview" style="width:50px; height:auto; display:${imageName ? "block" : "none"
        };">
  `;
      customItemsContainer.appendChild(div);

      const selectElement = div.querySelector(".item-image-name");
      const inputNameElement = div.querySelector(".item-name");

      // โหลดตัวเลือกเริ่มต้นใน dropdown
      populateImageOptions(selectElement, imageName, name);

      // เมื่อชื่อรายการเปลี่ยน ให้อัปเดต dropdown
      inputNameElement.addEventListener("input", () => {
        const currentName = inputNameElement.value.trim();
        if (currentName) {
          populateImageOptions(selectElement, "", currentName);
        }
      });

      // เมื่อเลือกชื่อรูปภาพ ให้อัปเดตชื่อรายการ
      selectElement.addEventListener("change", (event) => {
        const selectedOptionText =
          event.target.options[event.target.selectedIndex].text;
        if (selectedOptionText) {
          inputNameElement.value = selectedOptionText.split(".")[0]; // นำชื่อไฟล์ (ไม่รวม .jpg) ไปใส่ในช่องชื่อรายการ
        }
      });
    }

    function findClosestImages(inputName, images) {
      const lowerInputName = inputName.toLowerCase();
      return images.filter((image) =>
        image.toLowerCase().includes(lowerInputName)
      );
    }

        "มะนาว.jpg": "ผักสดๆจากสวนเจ้าของร้าน",
        "มะม่วงแช่อิ่ม.jpg": "",
        "กระเจี๊ยบเขียว.jpg": "",
        "ฟักเขียวอีสาน.jpg": "",
        "ปลีกล้วย.jpg": "",
        "มะยมฝรั่ง.jpg": "",
        "ลูกเชอรี่พร้อมพริกเกลือ.jpg": "",
        "เฉาก๊วยถุง+ถ้วย.jpg": "",
        "เค๊กกล้วยหอม.jpg": "",
        "ทิชชู่เปียก.jpg": "",
        "ทิชชู่.jpg": "",
      };

      const images = Object.keys(imageDetails); // ดึงรายการรูปภาพจาก imageDetails
      const filteredImages = itemName
        ? findClosestImages(itemName, images)
        : images;

      // เคลียร์ตัวเลือกเก่าทั้งหมด
      selectElement.innerHTML = `<option value="">เลือกชื่อรูปภาพ</option>`;

      // เพิ่มตัวเลือกใหม่
      filteredImages.forEach((image) => {
        const option = document.createElement("option");
        option.value = `${imageFolder}/${image}`;
        option.textContent = `${image}`;
        if (option.value === selectedImage) {
          option.selected = true;
        }
        selectElement.appendChild(option);
      });
      // เมื่อเลือกชื่อรูปภาพ ให้อัปเดตรายละเอียด
      selectElement.addEventListener("change", (event) => {
        const selectedImageName = event.target.value.split("/").pop(); // ดึงชื่อไฟล์จาก value
        const description =
          imageDetails[selectedImageName] || "ไม่มีรายละเอียด";
        const customItem = selectElement.closest(".custom-item"); // หา container หลัก
        if (customItem) {
          customItem.dataset.description = description; // บันทึก description ใน dataset
        }
      });
    }

    // คำนวณยอดรวม
    function calculateTotal() {
      const items = Array.from(document.querySelectorAll(".custom-item"));
      let total = 0;
      const rows = items.map((item) => {
        const name = item.querySelector(".item-name").value || "ไม่มีชื่อ";
        const qty = parseInt(item.querySelector(".item-qty").value) || 0;
        const price = parseInt(item.querySelector(".item-price").value) || 0;
        const imageUrl = item.querySelector(".item-image-name").value || "images/9.jpg";
        const sum = qty * price;
        total += sum;

        return `
      <tr>
        <td>${name}</td>
        <td>${qty}</td>
        <td>${price}</td>
        <td>${sum}</td>
        <td><img src="${imageUrl}" alt="Image" style="width:50px; height:auto;"></td>
      </tr>`;
      });

      document.getElementById("results").innerHTML = `
    <table border="1">
      <tr><th>ชื่อ</th><th>จำนวน</th><th>ราคา</th><th>รวม</th><th>รูปภาพ</th></tr>
      ${rows.join("")}
      <tr><td colspan="3">ยอดรวม</td><td>${total}</td><td></td></tr>
    </table>`;
    }

    function saveData() {
      const items = Array.from(document.querySelectorAll(".custom-item")).map(
        (item) => ({
          name: item.querySelector(".item-name").value || "ไม่มีชื่อ",
          qty: parseInt(item.querySelector(".item-qty").value) || 0,
          price: parseInt(item.querySelector(".item-price").value) || 0,
          imageUrl: item.querySelector(".item-image-name").value || "images/9.jpg",
          description: item.dataset.description || "ไม่มีรายละเอียด", // ดึง description จาก dataset
        })
      );

      db.collection("mama")
        .add({
          items: items,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        })
        .then(() => {
          alert("บันทึกข้อมูลเรียบร้อย");
        })
        .catch((error) => {
          console.error("Error saving data: ", error);
        });
    }

    // บันทึกรูปภาพ
    document.getElementById("saveImageBtn").addEventListener("click", () => {
      html2canvas(document.getElementById("results"))
        .then((canvas) => {
          const link = document.createElement("a");
          link.href = canvas.toDataURL("image/png");
          link.download = "summary.png";
          link.click();
        })
        .catch((error) => console.error("Error saving image: ", error));
    });

    // แสดงป๊อปอัปเคลียร์ข้อมูล
    function showClearPopup() {
      const documentList = document.getElementById("documentList");
      const itemList = document.getElementById("itemList");

      db.collection("mama").orderBy("timestamp", "desc").get().then((snapshot) => {
        documentList.innerHTML = "";
        itemList.innerHTML = "";

        snapshot.forEach((doc) => {
          const data = doc.data();
          const items = Array.isArray(data.items) ? data.items : [];
          const formattedTimestamp = data.timestamp
            ? new Date(data.timestamp.seconds * 1000).toLocaleString("th-TH")
            : "ไม่ระบุเวลา";

          const docLi = document.createElement("li");
          docLi.innerHTML = `
        <label>
          <input type="checkbox" class="document-checkbox" data-doc-id="${doc.id}" />
          ${formattedTimestamp} (${items.length} รายการ)
        </label>`;
          documentList.appendChild(docLi);

          items.forEach((item, index) => {
            const itemLi = document.createElement("li");
            itemLi.innerHTML = `
          <label>
            <input type="checkbox" class="item-checkbox" data-doc-id="${doc.id}" data-item-index="${index}" />
            ${item.name} - จำนวน: ${item.qty}, ราคา: ${item.price}
          </label>`;
            itemList.appendChild(itemLi);
          });
        });

        document.getElementById("clearPopup").style.display = "block";
      }).catch((error) => {
        console.error("Error fetching data from Firebase: ", error);
      });
    }
    // ปิดป๊อปอัป
    function closeClearPopup() {
      document.getElementById("clearPopup").style.display = "none";
    }

    function deleteSelectedItems() {
      const selectedDocuments = Array.from(document.querySelectorAll(".document-checkbox:checked"));
      const selectedItems = Array.from(document.querySelectorAll(".item-checkbox:checked"));

      let deletePromises = [];

      // 🔹 ลบเอกสารที่ถูกเลือก
      selectedDocuments.forEach((checkbox) => {
        const docId = checkbox.getAttribute("data-doc-id");
        deletePromises.push(db.collection("mama").doc(docId).delete());
      });

      // 🔹 ลบเฉพาะรายการสินค้าในเอกสาร (ไม่ลบทั้งเอกสาร)
      let itemDeleteMap = {}; // เก็บรายการสินค้าที่ต้องลบแยกตามเอกสาร

      selectedItems.forEach((checkbox) => {
        const docId = checkbox.getAttribute("data-doc-id");
        const itemIndex = parseInt(checkbox.getAttribute("data-item-index"));

        if (!itemDeleteMap[docId]) {
          itemDeleteMap[docId] = [];
        }
        itemDeleteMap[docId].push(itemIndex);
      });

      Object.keys(itemDeleteMap).forEach((docId) => {
        deletePromises.push(
          db.collection("mama").doc(docId).get().then((doc) => {
            if (doc.exists) {
              let data = doc.data();
              let updatedItems = data.items.filter((_, index) => !itemDeleteMap[docId].includes(index));

              if (updatedItems.length === 0) {
                return db.collection("mama").doc(docId).delete(); // ลบเอกสารถ้าไม่มีรายการเหลือ
              } else {
                return db.collection("mama").doc(docId).update({ items: updatedItems });
              }
            }
          })
        );
      });

      // 🔹 ดำเนินการลบทั้งหมด
      Promise.all(deletePromises)
        .then(() => {
          alert("ลบข้อมูลเรียบร้อย!");
          location.reload(); // รีโหลดหน้าใหม่
        })
        .catch((error) => console.error("Error deleting documents/items:", error));
    }

    function toggleItemList() {
      const itemList = document.getElementById("itemList");
      const toggleBtn = document.getElementById("toggleItemListBtn");

      if (itemList.style.display === "none") {
        itemList.style.display = "block";
        toggleBtn.textContent = "*ซ่อนรายการ";
      } else {
        itemList.style.display = "none";
        toggleBtn.textContent = "*แสดงรายการ";
      }
    }

    function closeClearPopup() {
      document.getElementById("clearPopup").style.display = "none";
    }

    function loadItemsFromFirebase() {
      db.collection("mama")
        .orderBy("timestamp", "desc")
        .limit(1)
        .get()
        .then((snapshot) => {
          if (!snapshot.empty) {
            snapshot.forEach((doc) => {
              const data = doc.data();
              const items = Array.isArray(data.items) ? data.items : [];
              console.log("Loaded items:", items);

              items.forEach((item) => {
                addNewItem(item.name, item.qty, item.price, item.imageUrl); // ส่งชื่อและ URL รูปภาพ
              });
            });
          } else {
            console.log("ไม่มีข้อมูลใน Firebase");
          }
        })
        .catch((error) => {
          console.error("Error fetching data from Firebase: ", error);
        });
    }

    function fetchLatestData() {
      db.collection("mama")
        .orderBy("timestamp", "desc")
        .limit(1)
        .get()
        .then((snapshot) => {
          if (snapshot.empty) {
            console.log("No latest data found");
            document.getElementById("results").innerHTML =
              "<p>ไม่มีข้อมูลล่าสุด</p>";
            return;
          }

          snapshot.forEach((doc) => {
            const data = doc.data();
            const items = Array.isArray(data.items) ? data.items : [];
            console.log("Fetched items:", items);

            // ✅ แปลง timestamp เป็นวันที่-เวลา
            let formattedDate = "ไม่ระบุเวลา";
            if (data.timestamp) {
              const timestamp = data.timestamp;
              const date = new Date(timestamp.seconds * 1000);
              formattedDate = date.toLocaleString("th-TH", {
                year: "numeric",
                month: "long",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
              });
            }

            let total = 0;
            const rows = items.map((item) => {
              const sum = item.qty * item.price;
              total += sum;
              return `
            <tr>
              <td>${item.name}</td>
              <td>${item.qty}</td>
              <td>${item.price}</td>
              <td>${sum}</td>
              <td><img src="${item.imageUrl || 'images/9.jpg'}" alt="Image" style="width:50px; height:auto;"></td>
            </tr>
          `;
            });

            // ✅ เพิ่มวันที่-เวลาบนสุดของตาราง
            document.getElementById("results").innerHTML = `
          <h3 class="date-header">วันที่ ${formattedDate}</h3>
          <table border="1">
            <tr><th>ชื่อ</th><th>จำนวน</th><th>ราคา</th><th>รวม</th><th>รูปภาพ</th></tr>
            ${rows.join("")}
            <tr><td colspan="3">ยอดรวม</td><td>${total}</td><td></td></tr>
          </table>
        `;
          });
        })
        .catch((error) => {
          console.error("Error fetching latest data: ", error);
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
      fetchLatestData(); // ดึงข้อมูลล่าสุดจาก Firestore
      loadItemsFromFirebase(); // ดึงข้อมูลจาก Firebase และแสดงในฟอร์ม
    });

    // คำนวณยอดรวมเมื่อมีการเปลี่ยนแปลงข้อมูล
    document.addEventListener("input", calculateTotal);
  </script>
